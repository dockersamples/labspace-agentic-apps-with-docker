<!DOCTYPE html>
<html>
<head>
    <title>Website Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <style>
        body { font-size: 18px; background-color: #f0f0f0; }
        #content { width: 20em; padding: 4em; text-align: center; margin: 2em auto; border: 1px solid #ccc; border-radius: .3em; background: #fff; }
        form { margin-bottom: 2em; }
        
    </style>
</head>
<body>
    <div id="content">
        <h2>Website Analyzer</h2>
        <form id="inputForm">
            <input type="text" placeholder="Enter website URL" id="url-input" />
            <input type="submit" value="Analyze Website" id="submit-button" />
        </form>
        <div id="output">Your analysis will appear here...</div>
    </div>

    <script type="text/javascript">
        (function() {
            const converter = new showdown.Converter();
            document.getElementById("inputForm").addEventListener("submit", onSubmit);
            const urlField = document.getElementById("url-input");
            const submitButton = document.getElementById("submit-button");
            const outputArea = document.getElementById("output");
            
            function onSubmit(e) {
                e.preventDefault();
    
                const url = urlField.value;
                urlField.disabled = true;
                submitButton.disabled = true;

                outputArea.innerText = "Analyzing website..."

                fetch("/analyze?url=" + encodeURIComponent(url))
                    .then((response) => response.json())
                    .then(({ analysis }) => {
                        outputArea.innerHTML = converter.makeHtml(analysis);
                    })
                    .finally(() => {
                        urlField.disabled = false;
                        submitButton.disabled = false;
                    });
            }
        })();
    </script>
</body>
</html>
